[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simclr-ms-mri"
version = "0.1.0"
description = "Longitudinal MS Brain MRI Lesion Evolution Analysis with Pretrained 3D MedicalNet & Contrastive Learning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "monai>=1.3.0",
    "nibabel>=5.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "nbformat>=5.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
